<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-label="FinanceGuard — Predicción de Churn Bancario. ROC-AUC 0,870, recall 0,76, 3 segmentos identificados. El churn según el número de productos contratados es no lineal: 27,7% con un producto, 7,6% con dos, 82,7% con tres y 100% con cuatro." style="background:#0a0e17; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;">
  <title>FinanceGuard — Predicción de Churn Bancario</title>
  <desc>Banner del proyecto. A la izquierda, título y métricas del modelo. A la derecha, la curva de abandono según el número de productos contratados, con el mínimo en dos productos y el salto crítico a partir del tercero.</desc>
  <defs>
    <!-- Background Gradient: Deep institutional navy/slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111c"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Curve gradient: Precision steel blue to warning amber to muted institutional crimson -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="68%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Subtle area fill under risk segment -->
    <linearGradient id="riskArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Plate -->
  <rect width="1600" height="360" fill="url(#bgGrad)"/>

  <!-- Subtle outer stroke border -->
  <rect x="0.5" y="0.5" width="1599" height="359" fill="none" stroke="#172234" stroke-width="1"/>

  <!-- Subtle grid baseline for structure -->
  <line x1="840" y1="40" x2="840" y2="320" stroke="#162032" stroke-width="1"/>

  <!-- ================= LEFT COLUMN: INSTITUTIONAL QUANTITATIVE HIERARCHY ================= -->
  <g transform="translate(88, 56)">
    <!-- Institutional Kicker / Classification -->
    <g transform="translate(0, 18)">
      <rect x="0" y="-14" width="6" height="18" fill="#0284c7" rx="1"/>
      <text x="16" y="0" fill="#60a5fa" font-size="18" font-weight="700" letter-spacing="2.2">QUANTITATIVE RISK MODELING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="-2">FinanceGuard</text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#94a3b8" font-size="22" font-weight="500" letter-spacing="-0.3">Predicción de Churn Bancario</text>

    <!-- Descriptor -->
    <text x="0" y="174" fill="#64748b" font-size="18" font-weight="400">Machine Learning supervisado y no supervisado sobre 10.000 clientes</text>

    <!-- Metrics -->
    <g transform="translate(0, 222)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#1e293b" stroke-width="1"/>

      <g transform="translate(0, 26)">
        <text x="0" y="0" fill="#64748b" font-size="18" font-weight="600" letter-spacing="0.8">ROC-AUC</text>
        <text x="106" y="0" fill="#f1f5f9" font-size="20" font-weight="700">0,870</text>
      </g>

      <line x1="205" y1="12" x2="205" y2="28" stroke="#1e293b" stroke-width="1.2"/>

      <g transform="translate(235, 26)">
        <text x="0" y="0" fill="#64748b" font-size="18" font-weight="600" letter-spacing="0.8">RECALL</text>
        <text x="92" y="0" fill="#38bdf8" font-size="20" font-weight="700">0,76</text>
      </g>

      <line x1="410" y1="12" x2="410" y2="28" stroke="#1e293b" stroke-width="1.2"/>

      <g transform="translate(440, 26)">
        <text x="0" y="0" fill="#64748b" font-size="18" font-weight="600" letter-spacing="0.8">SEGMENTOS</text>
        <text x="136" y="0" fill="#cbd5e1" font-size="19" font-weight="600">3 identificados</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: CURVA REAL DE CHURN POR NÚMERO DE PRODUCTOS =================
       Escala vertical: 0% en y=225, 100% en y=30 (1,95 px por punto porcentual).
       Datos reales del proyecto: 1 prod 27,7% · 2 prod 7,6% · 3 prod 82,7% · 4 prod 100%. -->
  <g transform="translate(900, 50)">

    <!-- Reference coordinate grid lines -->
    <line x1="20" y1="225" x2="630" y2="225" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="20" y1="30" x2="630" y2="30" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Y-axis reference levels -->
    <text x="14" y="229" fill="#475569" font-size="18" text-anchor="end" font-weight="500">0%</text>
    <text x="14" y="133" fill="#475569" font-size="18" text-anchor="end" font-weight="500">50%</text>
    <text x="14" y="34" fill="#94a3b8" font-size="18" text-anchor="end" font-weight="600">100%</text>

    <!-- Critical risk threshold -->
    <line x1="20" y1="127.5" x2="630" y2="127.5" stroke="#e11d48" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="630" y="117" fill="#f43f5e" font-size="18" font-weight="600" text-anchor="end" letter-spacing="0.3">Umbral crítico &gt; 50%</text>

    <!-- Area shading under high risk surge -->
    <path d="M 215 210.2 C 275 210, 340 80, 395 63.7 C 450 45, 500 32, 565 30 L 565 225 L 215 225 Z" fill="url(#riskArea)"/>

    <!-- Trajectory Curve: pasa exactamente por los cuatro puntos -->
    <path d="M 45 171 C 105 176, 160 210, 215 210.2 C 275 210, 340 80, 395 63.7 C 450 45, 500 32, 565 30" fill="none" stroke="url(#curveGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Vertical guideline at optimal product point -->
    <line x1="215" y1="125" x2="215" y2="225" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- POINT 1: 1 producto — 27,7% -->
    <circle cx="45" cy="171" r="4.5" fill="#0b111c" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="45" y="149" fill="#94a3b8" font-size="18" font-weight="600" text-anchor="middle">27,7%</text>
    <text x="45" y="254" fill="#64748b" font-size="18" font-weight="500" text-anchor="middle">1 prod</text>

    <!-- POINT 2: 2 productos — 7,6% (mínimo) -->
    <circle cx="215" cy="210.2" r="5.5" fill="#0b111c" stroke="#0284c7" stroke-width="3"/>
    <circle cx="215" cy="210.2" r="2" fill="#38bdf8"/>
    <text x="215" y="112" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">7,6% churn</text>
    <text x="215" y="254" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">2 prod (óptimo)</text>

    <!-- POINT 3: 3 productos — 82,7% -->
    <circle cx="395" cy="63.7" r="4.5" fill="#0b111c" stroke="#d97706" stroke-width="2.5"/>
    <text x="395" y="92" fill="#f59e0b" font-size="18" font-weight="700" text-anchor="middle">82,7%</text>
    <text x="395" y="254" fill="#94a3b8" font-size="18" font-weight="500" text-anchor="middle">3 prod</text>

    <!-- POINT 4: 4 productos — 100% -->
    <circle cx="565" cy="30" r="5" fill="#0b111c" stroke="#e11d48" stroke-width="3"/>
    <circle cx="565" cy="30" r="2" fill="#ffffff"/>
    <text x="565" y="14" fill="#f43f5e" font-size="18" font-weight="700" text-anchor="middle">100%</text>
    <text x="565" y="254" fill="#e11d48" font-size="18" font-weight="700" text-anchor="middle">4 prod</text>
  </g>
</svg>
